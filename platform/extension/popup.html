<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=420" />
<title>smarty-observability</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0b0e14; color: #e6edf3; width: 420px; min-height: 200px; }
  .header { padding: 12px 16px; background: #11151c; border-bottom: 1px solid #1f2630; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { margin: 0; font-size: 14px; color: #58a6ff; }
  .header .sub { font-size: 11px; color: #6b7280; }
  .list { max-height: 340px; overflow: auto; }
  .row { padding: 10px 16px; border-bottom: 1px solid #161b22; cursor: pointer; }
  .row:hover { background: #161b22; }
  .count { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 3px; background: #3d1418; color: #ff7b72; font-size: 11px; font-weight: 600; margin-right: 6px; text-align: center; }
  .msg { font-size: 12px; color: #d1d5db; }
  .meta { font-size: 10px; color: #6b7280; margin-top: 3px; }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; background: #21262d; color: #8b949e; margin-right: 4px; }
  .badge.root { background: #1f6feb33; color: #58a6ff; }
  .badge.ai { background: #3fb95033; color: #3fb950; }
  .badge.pending { background: #d2992233; color: #d29922; }
  .detail { padding: 14px 16px; }
  .detail h3 { margin: 0 0 8px; font-size: 13px; color: #c9d1d9; }
  .detail .src { font-size: 11px; padding: 4px 0; font-family: monospace; }
  .detail .ai { background: #0d1117; border: 1px solid #1f6feb44; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 11px; line-height: 1.5; }
  .btn { background: #1f6feb; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .btn:hover { background: #388bfd; }
  .btn.sec { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .empty { color: #6b7280; text-align: center; padding: 30px; font-size: 12px; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot.green { background: #3fb950; } .dot.yellow { background: #d29922; }
  pre { background: #0b0e14; padding: 8px; border-radius: 4px; font-size: 10px; max-height: 100px; overflow: auto; margin: 4px 0; border: 1px solid #1f2630; }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": { "react": "https://esm.sh/react@18.3.1", "react-dom/client": "https://esm.sh/react-dom@18.3.1/client", "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime" } }
</script>
<script type="module">
import React, { useState, useEffect, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
const { useState: us, useEffect: ue } = React;
const COORD = 'http://127.0.0.1:3920';

async function api(path, init) {
  const backend = await new Promise(r => chrome.runtime.sendMessage({ type: 'GET_BACKEND' }, b => r(b.backend)));
  return (await fetch(backend + path, init)).json();
}

function List({ onPick }) {
  const [groups, setGroups] = us([]);
  const load = useCallback(async () => setGroups((await api('/api/errors')).groups || []), []);
  ue(() => { load(); const t = setInterval(load, 4000); return () => clearInterval(t); }, [load]);
  if (groups.length === 0) return React.createElement('div', { className: 'empty' }, '无错误');
  return React.createElement('div', { className: 'list' }, groups.map(g =>
    React.createElement('div', { key: g.fingerprint, className: 'row', onClick: () => onPick(g.fingerprint) },
      React.createElement('div', null,
        React.createElement('span', { className: 'count' }, g.count),
        React.createElement('span', { className: 'msg' }, g.message.slice(0, 60)),
      ),
      React.createElement('div', { className: 'meta' },
        g.rootCause && React.createElement('span', { className: 'badge root' }, g.rootCause.kind),
        g.aiDiagnosis && React.createElement('span', { className: 'badge ai' }, 'AI✓'),
        g.aiDiagnosisPending && React.createElement('span', { className: 'badge pending' }, 'AI中'),
        g.affectedSessions, ' sessions · ', g.sample?.release || '?',
      ),
    )
  ));
}

function Detail({ fp, onBack }) {
  const [data, setData] = us(null);
  const [resolved, setResolved] = us(null);
  const [patch, setPatch] = us(null);
  const [busy, setBusy] = us(false);
  ue(() => { api('/api/errors/' + encodeURIComponent(fp)).then(d => { setData(d); setResolved(null); setPatch(null); }); const t = setInterval(() => api('/api/errors/' + encodeURIComponent(fp)).then(d => setData(d)), 3000); return () => clearInterval(t); }, [fp]);
  const g = data?.group;
  const rc = g?.rootCause;
  const ai = g?.aiDiagnosis;
  const s = g?.sample?.payload;
  const resolve = async () => {
    if (!s?.stack) return;
    const r = await api('/api/sourcemaps/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ appId: 'ext', version: g?.sample?.release || 'latest', stack: s.stack }) });
    setResolved((r.frames || []).filter(f => f.resolved));
  };
  const triggerHeal = async () => {
    setBusy(true);
    try {
      const r = await fetch(COORD + '/ai/patch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ record: { id: 'r', symptomId: fp, symptom: { kind: 'error', observed: s?.message || '' }, candidates: [{ kind: 'error.js', confidence: 0.8, evidence: [s?.stack || ''], anchors: { errorId: fp }, suggestedHealIds: [] }], severity: 'critical', createdAt: Date.now() }, files: [{ path: 'app.ts', content: s?.stack || '' }] }) });
      setPatch((await r.json()).proposal);
    } catch (e) { setPatch({ error: String(e) }); }
    setBusy(false);
  };
  return React.createElement('div', { className: 'detail' },
    React.createElement('button', { className: 'btn sec', onClick: onBack, style: { marginBottom: 10, fontSize: 11 } }, '← 返回'),
    React.createElement('h3', null, s?.message || '(no message)'),
    React.createElement('div', { className: 'meta' }, 'count ' + (g?.count || 0) + ' · fp ' + fp.slice(0, 8)),
    rc && React.createElement('div', { className: 'ai', style: { borderColor: '#3fb95044' } },
      React.createElement('b', null, '🎯 确定性根因: '), rc.kind, ' (', Math.round(rc.confidence * 100), '%)',
      React.createElement('br'),
      (rc.evidence || []).map((e, i) => React.createElement('div', { key: i, style: { fontSize: 10, color: '#8b949e' } }, '• ' + e)),
    ),
    ai ? React.createElement('div', { className: 'ai' },
      React.createElement('b', null, '🤖 AI 诊断: '), ai.diagnosis,
      ai.suggestedFix && React.createElement('pre', null, '修复: ' + ai.suggestedFix),
    ) : g?.aiDiagnosisPending ? React.createElement('div', { className: 'ai' },
      React.createElement('span', { className: 'dot yellow' }), 'AI 诊断中...'
    ) : null,
    React.createElement('div', { style: { marginTop: 10 } },
      React.createElement('button', { className: 'btn sec', onClick: resolve, style: { marginRight: 6 } }, 'sourcemap 还原'),
      React.createElement('button', { className: 'btn', onClick: triggerHeal, disabled: busy }, busy ? '生成中...' : '🛠 触发自愈 MR'),
    ),
    resolved && resolved.length > 0 && React.createElement('div', { style: { marginTop: 8 } },
      React.createElement('h3', null, '还原源码位置'),
      resolved.map((f, i) => React.createElement('div', { key: i, className: 'src' },
        '✓ ' + (f.source || '?') + ':' + (f.line || '?') + ':' + (f.column || '?'))),
    ),
    patch && React.createElement('div', { style: { marginTop: 8, padding: 8, background: '#0d1117', borderRadius: 4, fontSize: 11 } },
      React.createElement('b', null, '🛠 自愈补丁: '), patch.diagnosis?.slice(0, 60),
      patch.patches?.[0] && React.createElement('pre', null, patch.patches[0].filePath + ':\n' + (patch.patches[0].searchCode?.slice(0, 60) || '') + '\n→\n' + (patch.patches[0].replaceCode?.slice(0, 60) || '')),
    ),
  );
}

function App() {
  const [view, setView] = us('list');
  const [picked, setPicked] = useState('');
  return React.createElement('div', null,
    React.createElement('div', { className: 'header' },
      React.createElement('h1', null, 'smarty-observability'),
      React.createElement('div', { className: 'sub' }, view === 'detail' ? '错误详情' : '错误收件箱 · 后台已开启'),
    ),
    view === 'list'
      ? React.createElement(List, { onPick: (fp) => { setPicked(fp); setView('detail'); } })
      : React.createElement(Detail, { fp: picked, onBack: () => setView('list') }),
  );
}
// shim removed: useState is imported from react
createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
