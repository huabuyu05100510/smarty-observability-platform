<!DOCTYPE html>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Camera Plain Variable', ui-sans-serif, system-ui, -apple-system, sans-serif;
    margin: 0; background: #f7f4ed; color: #1c1c1c;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: #f7f4ed; border-right: 1px solid #eceae4; padding: 24px 0; }
  .sidebar h1 {
    font-size: 16px; font-weight: 600; letter-spacing: -0.3px;
    padding: 0 20px 20px; margin: 0; color: #1c1c1c; border-bottom: 1px solid #eceae4;
  }
  .nav-item {
    padding: 10px 20px; cursor: pointer; font-size: 14px; color: rgba(28,28,28,0.6);
    transition: all 0.15s ease; border-left: 2px solid transparent;
  }
  .nav-item:hover { background: rgba(28,28,28,0.04); color: #1c1c1c; }
  .nav-item.active { background: rgba(28,28,28,0.04); color: #1c1c1c; border-left-color: #1c1c1c; font-weight: 600; }
  .main { padding: 32px 40px; overflow: auto; }
  .card { background: #f7f4ed; border: 1px solid #eceae4; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .card h2 {
    margin: 0 0 16px; font-size: 20px; font-weight: 600; letter-spacing: -0.2px; color: #1c1c1c;
    display: flex; justify-content: space-between; align-items: center;
  }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; color: #1c1c1c; }
  .stat-label { font-size: 13px; color: #5f5f5d; margin-top: 4px; }
  .row { padding: 12px 0; border-bottom: 1px solid #eceae4; cursor: pointer; transition: background 0.1s; }
  .row:hover { background: rgba(28,28,28,0.03); }
  .count {
    display: inline-block; min-width: 32px; padding: 2px 8px; border-radius: 6px;
    background: rgba(28,28,28,0.06); color: #1c1c1c; font-size: 12px; font-weight: 600; margin-right: 8px; text-align: center;
  }
  .msg { color: #1c1c1c; font-size: 14px; }
  .meta { color: #5f5f5d; font-size: 12px; margin-top: 2px; }
  .good { color: #16a34a; } .ni { color: #ca8a04; } .poor { color: #dc2626; }
  pre {
    background: rgba(28,28,28,0.03); padding: 16px; border-radius: 8px; overflow: auto; font-size: 13px;
    border: 1px solid #eceae4; max-height: 360px; font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace; line-height: 1.5;
  }
  .btn {
    background: #1c1c1c; color: #fcfbf8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-family: inherit; transition: opacity 0.1s;
    box-shadow: rgba(255,255,255,0.2) 0px 0.5px 0px 0px inset, rgba(0,0,0,0.2) 0px 0px 0px 0.5px inset, rgba(0,0,0,0.05) 0px 1px 2px 0px;
  }
  .btn:hover { opacity: 0.85; } .btn:active { opacity: 0.8; }
  .btn.sec { background: #f7f4ed; color: #1c1c1c; border: 1px solid rgba(28,28,28,0.4); box-shadow: none; }
  .btn.sec:hover { background: rgba(28,28,28,0.04); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500;
    background: rgba(28,28,28,0.06); color: rgba(28,28,28,0.7); margin-left: 6px;
  }
  .badge.good { background: rgba(22,163,74,0.1); color: #16a34a; }
  .badge.ni { background: rgba(202,138,4,0.1); color: #ca8a04; }
  .badge.poor { background: rgba(220,38,38,0.1); color: #dc2626; }
  .ai { background: #f7f4ed; border: 1px solid #eceae4; }
  .ai h2 { color: #1c1c1c; }
  .empty { color: #5f5f5d; text-align: center; padding: 32px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eceae4; font-size: 12px; color: #5f5f5d; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 10px 8px; font-size: 14px; border-bottom: 1px solid rgba(28,28,28,0.06); color: #1c1c1c; }
  .bar-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .bar-bg { flex: 1; background: rgba(28,28,28,0.06); border-radius: 4px; height: 20px; overflow: hidden; }
  .bar-fg { height: 100%; background: #1c1c1c; border-radius: 4px; }
</style>

const e = React.createElement;

// INP 火焰图（SVG icicle）：root -> 三段（input/processing/presentation）-> LoAF 脚本，热帧标红
function InpFlamegraph({ fg }){
  if(!fg || !fg.roots || fg.roots.length===0) return e('div',{className:'empty'},'无火焰图数据（需 INP LoAF 脚本归因）');
  const W=720, RH=30, P=8, total=fg.totalMs||1;
  const bars=[]; const walk=(n)=>{ bars.push(n); (n.children||[]).forEach(walk); };
  fg.roots.forEach(walk);
  const maxDepth=Math.max(...bars.map(b=>b.depth))+1;
  const H=RH*maxDepth+P*2;
  const sc=ms=>P+(ms/total)*(W-2*P);
  const color=n=>n.synthetic?'#9ca3af':n.kind==='frame'?'#1c1c1c':n.kind==='script'?(n.isHot?'#dc2626':'#f97316'):(n.isHot?'#dc2626':'#0ea5e9');
  const txt=n=>(n.kind==='frame'||n.isHot)?'#fff':'#1c1c1c';
  return e('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block',background:'#fff',borderRadius:8,border:'1px solid #eceae4',maxHeight:260}},
    bars.map(n=>{
      const x=sc(n.startMs), w=Math.max(2,sc(n.startMs+n.durationMs)-x), y=P+n.depth*RH;
      const label=n.durationMs>=35?(n.name.length>w/6.2?n.name.slice(0,Math.floor(w/6.2))+'…':n.name):'';
      return e('g',{key:n.id},
        e('title',null,n.name+' · '+(n.meta&&n.meta.sourceURL?(' '+(n.meta.sourceFunctionName||'')+' @ '+n.meta.sourceURL):'')),
        e('rect',{x,y,width:w,height:RH-3,fill:color(n),rx:3,opacity:n.synthetic?0.5:1}),
        label&&e('text',{x:x+4,y:y+RH/2+4,fill:txt(n),fontSize:11,fontFamily:'monospace','pointer-events':'none'},label),
      );
    }),
  );
}

// 小折线（INP 样本值趋势，good/NI/poor 阈值线）
function InpTrend({ samples }){
  if(!samples||samples.length===0) return e('div',{className:'empty'},'无样本');
  const W=560,H=140,P=24,max=Math.max(600,...samples.map(s=>s.value));
  const pt=(i,v)=>[P+i*(W-2*P)/Math.max(1,samples.length-1), H-P-(v/max)*(H-2*P)];
  const pts=samples.map((s,i)=>pt(i,s.value));
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const line=(v,c)=>{const a=pt(0,v),b=pt(samples.length-1,v);return 'M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1];};
  return e('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block'}},
    e('path',{d:line(200,'#16a34a88'),stroke:'#16a34a',strokeWidth:1,strokeDasharray:'4 3',fill:'none'}),
    e('path',{d:line(500,'#dc262688'),stroke:'#dc2626',strokeWidth:1,strokeDasharray:'4 3',fill:'none'}),
    e('path',{d:path+' L'+pts[pts.length-1][0]+' '+(H-P)+' L'+pts[0][0]+' '+(H-P)+' Z',fill:'#0ea5e922'}),
    e('path',{d:path,fill:'none',stroke:'#0ea5e9',strokeWidth:2}),
    pts.map((p,i)=>e('circle',{key:i,cx:p[0],cy:p[1],r:3,fill:samples[i].rating==='poor'?'#dc2626':samples[i].rating==='needs-improvement'?'#ca8a04':'#16a34a'})),
  );
}
